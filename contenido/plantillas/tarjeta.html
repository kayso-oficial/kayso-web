          <article class="group crystal-glass rounded-2xl overflow-hidden hover-card transition-all duration-300 reveal-up">
            <a href="/blog/{{slug}}" class="block relative h-56 overflow-hidden">
              <img
                src="{{portada_url}}"
                alt="{{portada_alt}}"
                class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                loading="lazy"
              >
              <span class="absolute top-4 left-4 z-20 px-3 py-1 bg-black/60 backdrop-blur-md rounded-full text-xs font-bold text-white border border-white/10">
                {{categoria}}
              </span>
            </a>

            <div class="p-6">
              <div class="flex items-center gap-3 text-xs text-[var(--text-muted)] mb-3">
                <time datetime="{{fecha_iso}}">
                  <i class="far fa-calendar-alt mr-1"></i> {{fecha_texto}}
                </time>
                {{lectura_tarjeta}}
              </div>

              <h2 class="text-xl font-bold text-[var(--text-main)] mb-3 leading-tight group-hover:text-brand-red transition-colors">
                <a href="/blog/{{slug}}">{{titulo}}</a>
              </h2>

              <p class="text-sm text-[var(--text-muted)] mb-4 line-clamp-2">
                {{descripcion}}
              </p>

              <a href="/blog/{{slug}}" class="inline-flex items-center gap-2 text-sm font-bold text-brand-red hover:underline underline-offset-4">
                {{boton}} <i class="fas fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
              </a>
            </div>
          </article>
